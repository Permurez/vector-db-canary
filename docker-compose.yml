services:
# Qdrant service for vector search and storage
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
  # One-shot ingestion job that creates and populates the collection
  ingest:
    image: python:3.11-slim
    container_name: vector_db_ingest
    depends_on:
      - qdrant
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
      - hf_cache:/root/.cache/huggingface
    working_dir: /app
    command: >
      sh -c "pip install --default-timeout=100 -r requirements.txt &&
      until python -c \"import socket; socket.create_connection(('qdrant',6333),1)\";
      do sleep 2; done && python ingest.py"
# Prometheus service for monitoring the Qdrant instance
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # Volume for Prometheus data and configuration
      - prometheus_data:/prometheus 
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M

# Canary service for testing the Qdrant instance and Prometheus monitoring
  canary:
    image: python:3.11-slim
    container_name: canary_script
    restart: unless-stopped
    depends_on:
      ingest:
        condition: service_completed_successfully
    environment:
      - CURL_CA_BUNDLE=
      - REQUESTS_CA_BUNDLE=
    volumes: #Those volumes are used to persist data and cache dependencies
      - .:/app
      - pip_cache:/root/.cache/pip
      - hf_cache:/root/.cache/huggingface
    working_dir: /app
    command: >
      sh -c "pip install --default-timeout=100 -r requirements.txt && python canary.py"
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"

    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
volumes: # Volumes for persistent data storage
  qdrant_data:
  prometheus_data:
  pip_cache:
  hf_cache:
  grafana_data: